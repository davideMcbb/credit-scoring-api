name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B verify
      - name: Test summary
        if: always()
        run: |
          for d in surefire failsafe; do
            ls target/$d-reports/TEST-*.xml > /dev/null 2>&1 || continue
            line=$(grep -h -o '<testsuite [^>]*' target/$d-reports/TEST-*.xml | awk '
              function attr(s, n) { return match(s, n "=\"[0-9]+\"") ? substr(s, RSTART + length(n) + 2, RLENGTH - length(n) - 3) : 0 }
              { t += attr($0, "tests"); f += attr($0, "failures"); e += attr($0, "errors"); k += attr($0, "skipped") }
              END { printf "%d tests, %d failures, %d errors, %d skipped", t, f, e, k }')
            echo "::notice title=$d::$line"
            echo "**$d**: $line" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Docker image
        run: docker build -t credit-scoring-api .
