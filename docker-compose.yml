# Local run: docker compose up --build, then open http://localhost:8080/swagger-ui.html
# Ports are bound to 127.0.0.1 only. Set DB_PASSWORD in your environment or in a .env file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scoring
      POSTGRES_USER: scoring
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoring -d scoring"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/scoring
      DB_USER: scoring
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
