spring:
  application:
    name: credit-scoring-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scoring}
    username: ${DB_USER:scoring}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema belongs to Flyway; Hibernate only checks it
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
